<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Branches Mind Mapper</title>
<style>
:root{
  --bg:#f6f7f9; --dot:#d5dae1; --panel:#ffffff; --panel2:#f0f2f5; --border:#e0e4ea; --text:#1c2330; --muted:#7a8494;
  --root-bg:#ffffff; --root-border:#d9dee5; --sel:#3b82f6; --sel-soft:rgba(59,130,246,.14); --shadow:0 10px 30px rgba(20,30,50,.12);
  --tool:#7c5cff; --tool-soft:rgba(124,92,255,.14); --danger:#d64545;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161f; --dot:#273040; --panel:#1a202a; --panel2:#232a35; --border:#2e3644; --text:#e8ecf2; --muted:#8792a3;
    --root-bg:#2b3340; --root-border:#2b3340; --sel:#4c8dff; --sel-soft:rgba(76,141,255,.18); --shadow:0 10px 30px rgba(0,0,0,.4);
    --tool:#8b6dff; --tool-soft:rgba(139,109,255,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161f; --dot:#273040; --panel:#1a202a; --panel2:#232a35; --border:#2e3644; --text:#e8ecf2; --muted:#8792a3;
  --root-bg:#2b3340; --root-border:#2b3340; --sel:#4c8dff; --sel-soft:rgba(76,141,255,.18); --shadow:0 10px 30px rgba(0,0,0,.4);
  --tool:#8b6dff; --tool-soft:rgba(139,109,255,.2);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
#app{display:flex;height:100%;width:100%}

/* ---------- sidebar (Whimsical-style) ---------- */
#sidebar{width:264px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:30;transition:margin-left .2s ease}
#app.nosidebar #sidebar{margin-left:-264px}
.sb-head{display:flex;align-items:center;gap:6px;padding:12px 10px 8px 12px}
.profile{display:flex;align-items:center;gap:8px;min-width:0;flex:1;padding:6px 8px;border-radius:8px;text-align:left}
.profile:hover{background:var(--panel2)}
.profile img{width:24px;height:24px;border-radius:50%;flex:none;background:var(--panel2)}
.profile span{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile svg{width:14px;height:14px;flex:none;stroke:var(--muted);fill:none;stroke-width:2}
.newbtn{width:30px;height:30px;border-radius:50%;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.newbtn:hover{border-color:var(--muted)}
#sbBanner{margin:4px 12px 8px;padding:10px 12px;border-radius:10px;background:var(--sel-soft);font-size:12.5px;line-height:1.45}
#sbBanner button{margin-top:8px}
#doclist{flex:1;overflow:auto;padding:4px 8px 12px}
.sec{display:flex;align-items:center;gap:6px;width:100%;padding:12px 8px 6px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sec svg{width:10px;height:10px;fill:var(--muted);transition:transform .15s}
.sec.closed svg{transform:rotate(-90deg)}
.sec-empty{font-size:12.5px;color:var(--muted);padding:2px 10px 8px 24px;line-height:1.45}
.doc{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;margin-bottom:1px;align-items:center}
.doc:hover{background:var(--panel2)}
.doc.on{background:var(--sel-soft)}
.doc .di{grid-row:1/3;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--tool-soft);color:var(--tool)}
.doc .di svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.doc .di img{width:22px;height:22px;border-radius:50%}
.doc .dt{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .dm{font-size:11.5px;color:var(--muted);grid-row:2;grid-column:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .del{grid-row:1/3;grid-column:3;opacity:0;font-size:12px;color:var(--muted);padding:4px 6px;border-radius:6px}
.doc:hover .del,.doc .del.armed{opacity:1}
.doc .del:hover{background:var(--panel)}
.doc .del.armed{color:#fff;background:var(--danger)}
.sb-foot{border-top:1px solid var(--border);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);font-size:13px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--sel);border-color:var(--sel);color:#fff}
.btn.danger{color:var(--danger)}
.sb-foot .btn{font-size:12px;padding:0 8px}
.sb-foot .wide{grid-column:1/3}

/* ---------- stage ---------- */
#stage{position:relative;flex:1;overflow:hidden;touch-action:none;outline:none;
  background-color:var(--bg);background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.4px);background-size:24px 24px}
#stage.panning,#stage.space,#stage[data-tool="hand"]{cursor:grab}
#stage.panning.moving{cursor:grabbing}
#stage[data-tool="mindmap"],#stage[data-tool="note"],#stage[data-tool="text"],#stage[data-tool="table"]{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#items{position:absolute;left:0;top:0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#edges path.dim{opacity:.25}
#nodes{position:absolute;left:0;top:0}
#selbox{position:absolute;border:1.5px dashed var(--sel);border-radius:6px;pointer-events:none}
#marquee{position:absolute;border:1px solid var(--sel);background:var(--sel-soft);pointer-events:none;z-index:15}

.node{position:absolute;left:0;top:0;width:max-content;padding:6px 10px;border-radius:7px;font-size:16px;line-height:1.4;font-weight:450;color:var(--text);
  user-select:none;-webkit-user-select:none;cursor:default;white-space:nowrap}
.node .label{display:block;white-space:pre-wrap;overflow-wrap:anywhere;max-width:380px;min-width:2px;min-height:1.4em;outline:none}
.node .label:empty::before{content:attr(data-ph);color:var(--muted)}
.node.l1{font-size:17px;font-weight:500}
.node.root{background:var(--root-bg);border:1px solid var(--root-border);padding:13px 24px;border-radius:10px;font-size:23px;font-weight:500;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.node.root .label{max-width:420px}
.node:hover:not(.sel){background:var(--sel-soft)}
.node.root:hover:not(.sel){background:var(--root-bg);border-color:var(--sel)}
.node.sel{box-shadow:0 0 0 2px var(--sel)}
.node.root.sel{box-shadow:0 0 0 2px var(--sel),0 2px 10px rgba(0,0,0,.12)}
.node.editing{box-shadow:0 0 0 2px var(--sel);cursor:text}
.node.editing .label{user-select:text;-webkit-user-select:text;cursor:text;caret-color:var(--sel)}
.node.dragging{opacity:.3}
.node.drop{box-shadow:0 0 0 2px var(--sel);background:var(--sel-soft)!important}
.node .tog,.node .badge{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg)}
.node .tog{left:calc(100% - 8px);width:16px;height:16px;border:2px solid var(--c);opacity:0;pointer-events:none;transition:opacity .12s}
.node .tog::before{content:"";width:6px;height:2px;border-radius:1px;background:var(--c)}
.node.has-kids:not(.collapsed):hover .tog,.node.sel.has-kids:not(.collapsed):not(.editing) .tog{opacity:1;pointer-events:auto}
.node .badge{display:none;left:calc(100% + 2px);min-width:24px;height:24px;padding:0 6px;border-radius:12px;border:2px solid var(--c);font-size:11.5px;font-weight:700;color:var(--text);line-height:1}
.node.collapsed .badge{display:flex}
/* add buttons: small solid circles in the branch colour, like Whimsical */
.node .plus,.node .sib{position:absolute;display:none;align-items:center;justify-content:center;width:20px;height:20px;padding:0;border-radius:50%;
  background:var(--add);color:#fff;box-shadow:0 0 0 3px var(--bg),0 2px 6px rgba(0,0,0,.25);z-index:2;opacity:.92;
  transition:transform .12s ease,opacity .12s ease}
.node .plus svg,.node .sib svg{width:10px;height:10px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}
.node .plus{left:calc(100% + 10px);top:50%;transform:translateY(-50%)}
.node .sib{left:50%;top:calc(100% + 8px);transform:translateX(-50%)}
.node .plus:hover{opacity:1;transform:translateY(-50%) scale(1.12)}
.node .sib:hover{opacity:1;transform:translateX(-50%) scale(1.12)}
.node.sel:not(.has-kids):not(.editing) .plus{display:flex}
.node.sel:not(.root):not(.editing) .sib{display:flex}
.node.left .tog{left:auto;right:calc(100% - 8px)}
.node.left .badge{left:auto;right:calc(100% + 2px)}
.node.left .plus{left:auto;right:calc(100% + 10px)}

/* ---------- free objects: images, tables, notes, text ---------- */
.item{position:absolute;left:0;top:0;user-select:none;-webkit-user-select:none}
.item.sel{outline:2px solid var(--sel);outline-offset:3px;border-radius:4px}
.item .ibody{outline:none;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.4em}
.item.editing .ibody,.item.editing td[contenteditable]{user-select:text;-webkit-user-select:text;cursor:text}
.item-image img{display:block;width:100%;height:100%;object-fit:contain;border-radius:6px;pointer-events:none}
.item-image.broken{background:var(--panel2);border:1px dashed var(--border);border-radius:6px}
.item-image.broken img{visibility:hidden}
.item-image.broken::after{content:"Image unavailable";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.item-note{padding:14px 16px;border-radius:4px;color:#1d2430;box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:15px;line-height:1.45;min-height:110px}
.item-note .ibody:empty::before{content:"Type something";color:rgba(29,36,48,.45)}
.item-text{font-size:20px;line-height:1.35;color:var(--text);padding:2px 4px;max-width:640px;width:max-content}
.item-text .ibody:empty::before{content:"Text";color:var(--muted)}
.item-table{width:max-content}
.item-table table{border-collapse:collapse;background:var(--panel);font-size:14px;line-height:1.4;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.item-table td{border:1px solid var(--border);padding:7px 11px;min-width:56px;max-width:280px;white-space:pre-wrap;overflow-wrap:anywhere;vertical-align:top;outline:none}
.item-table tr.head td{background:var(--panel2);font-weight:600}
.item-table td.cur{box-shadow:inset 0 0 0 2px var(--sel)}
.rh{position:absolute;right:-7px;bottom:-7px;width:12px;height:12px;border-radius:3px;background:var(--bg);border:2px solid var(--sel);cursor:nwse-resize;display:none}
.item.sel .rh{display:block}

#dropbar{position:absolute;height:4px;width:90px;border-radius:2px;background:var(--sel);pointer-events:none;box-shadow:0 0 0 3px var(--sel-soft)}
.ghost{position:fixed;z-index:50;pointer-events:none;padding:6px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--sel);box-shadow:var(--shadow);font-size:15px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.95}
#stage.filedrop::after{content:"Drop images to add them";position:absolute;inset:12px;border:2px dashed var(--sel);border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--sel);background:var(--sel-soft);z-index:45;pointer-events:none}

/* ---------- floating ui ---------- */
.float{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);z-index:20}
#topbar{left:12px;top:12px;display:flex;align-items:center;gap:4px;padding:5px;max-width:calc(100% - 24px)}
#topright{right:12px;top:12px;display:flex;align-items:center;gap:2px;padding:5px}
.ib{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--text);flex:none}
.ib:hover{background:var(--panel2)}
.ib.on{background:var(--sel-soft);color:var(--sel)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#space{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:7px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
#space:hover{background:var(--panel2);color:var(--text)}
#space svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}
.crumb{color:var(--muted);padding:0 2px}
#title{font:inherit;font-size:15px;font-weight:600;color:var(--text);background:transparent;border:1px solid transparent;border-radius:7px;padding:6px 8px;width:230px;max-width:100%;min-width:0}
#title:hover{border-color:var(--border)}
#title:focus{outline:none;border-color:var(--sel);background:var(--bg)}
#shareBtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:600}
#shareBtn:hover{background:var(--panel2)}
#shareBtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9}
.sep{width:1px;height:22px;background:var(--border);margin:0 4px;flex:none}

/* tool rail */
#rail{left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:14px}
#rail .ib{width:40px;height:40px;border-radius:10px}
#rail .ib svg{width:20px;height:20px}
#rail .ib.on{background:var(--tool);color:#fff}
#rail .rsep{height:1px;background:var(--border);margin:3px 4px}

#zoombar{right:12px;bottom:12px;display:flex;align-items:center;padding:4px;gap:2px}
#zoomPct{min-width:56px;height:34px;font-size:13px;font-weight:600;border-radius:8px;font-variant-numeric:tabular-nums}
#zoomPct:hover{background:var(--panel2)}
#hint{left:50%;top:50%;transform:translate(-50%,-50%);padding:22px 26px;font-size:14px;color:var(--muted);text-align:center;max-width:min(420px,calc(100% - 32px));line-height:1.5}
#hint h2{margin:0 0 6px;font-size:17px;color:var(--text)}
#hint .row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
#loading{left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 20px;font-size:14px;color:var(--muted)}
#banner{left:50%;bottom:64px;transform:translateX(-50%);padding:10px 14px;font-size:13px;max-width:min(560px,calc(100% - 32px));line-height:1.45}

.tbar{display:flex;align-items:center;gap:2px;padding:5px;border-radius:12px;z-index:25;white-space:nowrap}
.tbar .swatches{display:flex;gap:3px;padding:0 4px}
.sw{width:20px;height:20px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.sw.auto{background:conic-gradient(#a541cc,#3d72de,#23a094,#e07b39,#d8a31f,#a541cc)}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--sel)}
.tbar .ib{width:32px;height:32px}
.tbar .tl{height:32px;padding:0 9px;border-radius:8px;font-size:12.5px;font-weight:600}
.tbar .tl:hover{background:var(--panel2)}
.tbar .tl.on{background:var(--sel-soft);color:var(--sel)}

#help,#dialog{left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;padding:20px 22px;z-index:40}
#help h2,#dialog h2{margin:0 0 4px;font-size:17px;text-wrap:balance}
#help p,#dialog p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.5}
#help table{width:100%;border-collapse:collapse;font-size:13.5px}
#help td{padding:6px 0;border-top:1px solid var(--border);vertical-align:top}
#help td:first-child{width:46%;padding-right:12px}
kbd{display:inline-block;font:600 12px/1 var(--font);padding:4px 6px;border-radius:5px;background:var(--panel2);border:1px solid var(--border);margin:0 2px 2px 0;white-space:nowrap}
#dialog input[type="search"]{width:100%;height:38px;padding:0 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
.plist{margin:10px 0 4px;display:flex;flex-direction:column;gap:2px}
.prow{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:8px}
.prow:hover{background:var(--panel2)}
.prow img{width:28px;height:28px;border-radius:50%;flex:none}
.prow .pn{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pr{font-size:12.5px;color:var(--muted)}
.dlg-foot{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.linkbox{margin-top:14px;padding:12px;border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:10px}
.licon{width:32px;height:32px;border-radius:8px;background:var(--sel-soft);color:var(--sel);display:flex;align-items:center;justify-content:center;flex:none}
.licon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.ltext{flex:1;min-width:0}
.ltext b{display:block;font-size:14px;font-weight:600}
.ltext span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.lcopy{display:flex;gap:8px}
.lcopy input{flex:1;min-width:0;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font:inherit;font-size:12.5px}
.switch{position:relative;width:40px;height:22px;flex:none;cursor:pointer}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:11px;background:var(--border);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+span{background:var(--sel)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--sel);outline-offset:2px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
#menu{left:12px;top:56px;width:280px;padding:6px;z-index:45}
#menu .mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;font-size:13.5px;text-align:left}
#menu .mi:hover{background:var(--panel2)}
#menu .who{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border);margin-bottom:4px}
#menu .who img{width:34px;height:34px;border-radius:50%}
#menu .who b{display:block;font-size:14px}
#menu .who span{font-size:12px;color:var(--muted);line-height:1.4}
#toast{left:50%;top:16px;transform:translateX(-50%);padding:9px 14px;font-size:13px;font-weight:500;z-index:60;pointer-events:none;transition:opacity .2s;opacity:0;max-width:calc(100% - 32px)}
#toast.show{opacity:1}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:35}

@media (max-width:720px){
  #sidebar{position:absolute;left:0;top:0;bottom:0;box-shadow:var(--shadow)}
  #title{width:120px}
  #space .sl{display:none}
  #rail{top:auto;bottom:12px;transform:none;flex-direction:row;left:12px}
  #rail .rsep{width:1px;height:auto;margin:4px 3px}
  #rail .ib{width:36px;height:36px}
  #zoombar{bottom:68px}
  #shareBtn span{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar" class="ui">
    <div class="sb-head">
      <button class="profile" id="profileBtn" aria-label="Account menu"><img id="avatar" alt=""><span id="profileName">This browser</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="newbtn" id="newDoc" title="New board" aria-label="New board">+</button>
    </div>
    <div id="sbBanner" hidden></div>
    <div id="doclist" role="list"></div>
    <div class="sb-foot">
      <button class="btn wide" id="copyText" title="Copy the whole map as an indented list (pastes into Notion, Slack, docs)">Copy as indented list</button>

<script>
(() => {
'use strict';

/* =========================================================================
   Constants & helpers
   ========================================================================= */
const PALETTE = ['#a541cc','#3d72de','#23a094','#e07b39','#d8a31f','#de4f8e','#55b04f','#e05555'];
const NOTE_COLORS = ['#fde68a','#fbcfe8','#bfdbfe','#bbf7d0','#ddd6fe','#fed7aa'];
const HGAP_ROOT = 92, HGAP = 80, VGAP_ROOT = 26, VGAP_L1 = 14, VGAP = 10;
const LS_KEY = 'mindmaps.store.v1', LS_DOC = 'mindmaps.doc.', LS_VIEW = 'mindmaps.view.';
const IS_MAC = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);
const MOD = IS_MAC ? '⌘' : 'Ctrl', ALT = IS_MAC ? '⌥' : 'Alt';
const PLACE_TOOLS = new Set(['mindmap', 'note', 'text', 'table']);

const $ = s => document.querySelector(s);
const app = $('#app'), stage = $('#stage'), world = $('#world'), edgesSvg = $('#edges'), nodesLayer = $('#nodes'), itemsLayer = $('#items');
const toolbar = $('#toolbar'), itoolbar = $('#itoolbar'), dropbar = $('#dropbar'), marqueeEl = $('#marquee'), selboxEl = $('#selbox');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 8);
const rid = () => Math.random().toString(36).slice(2, 12);
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON_MAP = '<svg viewBox="0 0 24 24"><rect x="2.5" y="9.5" width="6" height="5" rx="1.5"/><path d="M8.5 12c4 0 3-6 7-6M8.5 12c4 0 3 6 7 6"/></svg>';
const ICON_LOCK = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const ICON_PEOPLE = '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 5.8"/></svg>';
const ICON_DEVICE = '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>';

/* =========================================================================
   State
   ========================================================================= */
let MODE = 'local';                 // 'local' = this browser only, 'cloud' = saved to the signed-in account
let db = null, userApi = null, assetsApi = null, myId = null, me = null;
let store = { order: [], current: null, theme: null, sidebar: true, closed: {} };
const docs = {};                    // id -> board {id,title,nodes,roots,items,updated,space,owner,members}
let localBoards = [];               // in cloud mode: boards still sitting in this browser, offered for moving
let doc = null;
let parentOf = {}, depthOf = {}, rootOf = {};
let pos = {}, itemRect = {};
const els = new Map(), itemEls = new Map();
let sel = new Set(), primary = null;
let editing = null, editBefore = null;  // mind-map node being typed into
let iedit = null;                        // {id, r, c, el, before} object being typed into
let tableCursor = null;                  // {id, r, c}
let tool = 'select';
let undoStack = [], redoStack = [];
const view = { x: 0, y: 0, z: 1 };
let ptr = null, spaceDown = false, clip = null, dragSet = null;
let lastPointer = null;

const isNode = id => !!(doc && id != null && doc.nodes[id]);
const isItem = id => !!(doc && id != null && doc.items[id]);

/* =========================================================================
   Model helpers
   ========================================================================= */
function normalize(d){
  d.nodes = d.nodes || {}; d.roots = Array.isArray(d.roots) ? d.roots : []; d.items = d.items || {};
  return d;
}
function reindex(){
  parentOf = {}; depthOf = {}; rootOf = {};
  doc.roots = doc.roots.filter(r => doc.nodes[r.id]);
  for (const r of doc.roots){
    const walk = (id, d, p) => {
      const n = doc.nodes[id];
      parentOf[id] = p; depthOf[id] = d; rootOf[id] = r.id;
      n.children = n.children.filter(c => doc.nodes[c]);
      for (const c of n.children) walk(c, d + 1, id);
    };
    walk(r.id, 0, null);
  }
}
const isRoot = id => parentOf[id] == null;
const rootEntry = id => doc.roots.find(r => r.id === id);
const visibleKids = id => { const n = doc.nodes[id]; return n.collapsed ? [] : n.children; };
function countDesc(id){ let c = 0; for (const k of doc.nodes[id].children) c += 1 + countDesc(k); return c; }
function branchColor(id){
  let cur = id;
  while (cur != null){
    const n = doc.nodes[cur];
    if (n.color) return n.color;
    const p = parentOf[cur];
    if (p == null) return null;
    if (parentOf[p] == null) return PALETTE[doc.nodes[p].children.indexOf(cur) % PALETTE.length];
    cur = p;
  }
  return null;
}
function newNode(text = ''){
  const id = uid();
  doc.nodes[id] = { id, text, children: [], collapsed: false, color: null };
  return id;
}
function subtreeIds(id, out = new Set()){ out.add(id); for (const k of doc.nodes[id].children) subtreeIds(k, out); return out; }
function topLevel(ids){
  const s = new Set(ids);
  return ids.filter(id => { let p = parentOf[id]; while (p != null){ if (s.has(p)) return false; p = parentOf[p]; } return true; });
}
function cloneTree(id){
  const n = doc.nodes[id];
  const c = newNode(n.text);
  Object.assign(doc.nodes[c], { color: n.color, collapsed: n.collapsed });
  doc.nodes[c].children = n.children.map(cloneTree);
  return c;
}
function exportTree(id){ const n = doc.nodes[id]; return { text: n.text, color: n.color || undefined, collapsed: n.collapsed || undefined, children: n.children.map(exportTree) }; }
function importTree(t){
  const id = newNode(t.text || '');
  if (t.color) doc.nodes[id].color = t.color;
  if (t.collapsed) doc.nodes[id].collapsed = true;
  doc.nodes[id].children = (t.children || []).map(importTree);
  return id;
}
function removeNodes(ids){
  ids = topLevel(ids.filter(id => doc.nodes[id]));
  let fallback = null;
  for (const id of ids){
    const p = parentOf[id];
    if (p == null) doc.roots = doc.roots.filter(r => r.id !== id);
    else { const arr = doc.nodes[p].children, i = arr.indexOf(id); arr.splice(i, 1); fallback = arr[i - 1] ?? arr[i] ?? p; }
    for (const x of subtreeIds(id)) delete doc.nodes[x];
  }
  return fallback && doc.nodes[fallback] ? fallback : null;
}
function moveNode(id, newParent, index){
  const p = parentOf[id];
  if (p == null) doc.roots = doc.roots.filter(r => r.id !== id);
  else { const a = doc.nodes[p].children; a.splice(a.indexOf(id), 1); }
  const arr = doc.nodes[newParent].children;
  if (index == null || index > arr.length) index = arr.length;
  arr.splice(index, 0, id);
  doc.nodes[newParent].collapsed = false;
  reindex();
}
/* free objects */
const nextZ = () => Object.values(doc.items).reduce((m, it) => Math.max(m, it.z || 0), 0) + 1;
function addItem(it){ it.id = it.id || uid(); it.z = nextZ(); doc.items[it.id] = it; return it.id; }
function itemBox(id){
  const it = doc.items[id], r = itemRect[id];
  return { x: it.x, y: it.y, w: r ? r.w : (it.w || 120), h: r ? r.h : (it.h || 40) };
}
const boxOf = id => isNode(id) ? pos[id] : isItem(id) ? itemBox(id) : null;

/* ---------- outline (indented list) import/export ---------- */
function parseOutline(text){
  const lines = text.replace(/\r\n?/g, '\n').split('\n').filter(l => l.trim());
  const roots = [], stack = [];
  let headLevel = 0;
  for (const line of lines){
    let lead = line.match(/^[\t ]*/)[0].replace(/\t/g, '    ').length;
    const h = line.trim().match(/^(#{1,6})\s+/);
    if (h){ headLevel = h[1].length; lead = (headLevel - 1) * 10000; }
    else lead += headLevel * 10000;
    const t = line.trim().replace(/^#{1,6}\s+/, '').replace(/^([-*+•◦▪‣]|\d+[.)])\s+/, '').replace(/^\[[ xX]\]\s+/, '');
    const node = { text: t, children: [] };
    while (stack.length && stack[stack.length - 1].ind >= lead) stack.pop();
    if (stack.length) stack[stack.length - 1].node.children.push(node); else roots.push(node);
    stack.push({ ind: lead, node });
  }
  return roots;
}
function outlineOf(ids){
  const out = [];
  const w = (id, d) => { out.push('\t'.repeat(d) + '- ' + doc.nodes[id].text.replace(/\s*\n\s*/g, ' ')); for (const k of doc.nodes[id].children) w(k, d + 1); };
  ids.forEach(id => w(id, 0));
  return out.join('\n');
}
/* ---------- tables from the clipboard ---------- */
function squareUp(rows){
  rows = rows.slice(0, 300).map(r => r.slice(0, 40).map(c => String(c ?? '').slice(0, 2000)));
  const cols = Math.max(1, ...rows.map(r => r.length));
  rows.forEach(r => { while (r.length < cols) r.push(''); });
  while (rows.length > 1 && rows[rows.length - 1].every(c => !c.trim())) rows.pop();
  return rows.length * cols >= 2 ? rows : null;
}
function parseHtmlTable(html){
  if (!/<table/i.test(html)) return null;
  let d; try { d = new DOMParser().parseFromString(html, 'text/html'); } catch(e){ return null; }
  const t = d.querySelector('table'); if (!t) return null;
  const rows = [];
  for (const tr of t.querySelectorAll('tr')){
    const row = [];
    for (const cell of tr.children){
      if (!/^T[DH]$/.test(cell.tagName)) continue;
      row.push(cell.textContent.replace(/ /g, ' ').replace(/[ \t]*\n[ \t]*/g, '\n').replace(/\n{2,}/g, '\n').trim());
      const span = Math.min(parseInt(cell.getAttribute('colspan') || '1', 10) || 1, 20);
      for (let i = 1; i < span; i++) row.push('');
    }
    if (row.length) rows.push(row);
  }
  return rows.length ? squareUp(rows) : null;
}
/** Tab-separated text (cells copied from a spreadsheet). Leading tabs alone mean an indented list, not a table. */
function parseTSV(text){
  const lines = text.replace(/\r\n?/g, '\n').replace(/\n+$/, '').split('\n');
  if (!lines.length || !lines.every(l => /[^\t]\t/.test(l))) return null;
  return squareUp(lines.map(l => l.split('\t').map(c => c.replace(/^"([\s\S]*)"$/, '$1').trim())));
}
const tableTSV = it => it.rows.map(r => r.map(c => c.replace(/\s*\n\s*/g, ' ')).join('\t')).join('\n');
const tableHTML = it => '<table>' + it.rows.map((r, i) => '<tr>' + r.map(c => (i === 0 && it.header ? '<th>' : '<td>') + esc(c) + (i === 0 && it.header ? '</th>' : '</td>')).join('') + '</tr>').join('') + '</table>';

/* =========================================================================
   History
   ========================================================================= */
const snapshot = () => JSON.stringify({ nodes: doc.nodes, roots: doc.roots, items: doc.items });
function record(before){
  undoStack.push({ s: before, sel: [...sel], primary });
  if (undoStack.length > 400) undoStack.shift();
  redoStack = [];
  updateUndoButtons();
}
function restore(entry){
  const d = JSON.parse(entry.s);
  doc.nodes = d.nodes; doc.roots = d.roots; doc.items = d.items || {};
  reindex();
  sel = new Set((entry.sel || []).filter(id => doc.nodes[id] || doc.items[id]));
  primary = entry.primary && (doc.nodes[entry.primary] || doc.items[entry.primary]) ? entry.primary : ([...sel][0] || null);
  touch(); render();
}
function undo(){
  if (!doc) return;
  commitEdit(); commitItemEdit();
  const e = undoStack.pop(); if (!e) return;
  redoStack.push({ s: snapshot(), sel: [...sel], primary });
  restore(e); updateUndoButtons();
}
function redo(){
  if (!doc) return;
  commitEdit(); commitItemEdit();
  const e = redoStack.pop(); if (!e) return;
  undoStack.push({ s: snapshot(), sel: [...sel], primary });
  restore(e); updateUndoButtons();
}
function updateUndoButtons(){
  $('#undoBtn').disabled = !undoStack.length;
  $('#redoBtn').disabled = !redoStack.length;
}
/** Run a mutation as one undoable step. */
function change(fn){
  commitEdit(); commitItemEdit();
  const before = snapshot();
  fn();
  reindex();
  if (snapshot() !== before){ record(before); touch(); }
  render();
}

/* =========================================================================
   Saving: this browser (local) or the signed-in account (cloud)
   ========================================================================= */
let saveTimer = null, viewTimer = null, saveWarned = false;
const dirty = new Set();
function touch(){ if (!doc) return; doc.updated = Date.now(); dirty.add(doc.id); clearTimeout(saveTimer); saveTimer = setTimeout(flushSaves, MODE === 'cloud' ? 700 : 300); }
function flushSaves(){
  clearTimeout(saveTimer);
  for (const id of [...dirty]){
    dirty.delete(id);
    const d = docs[id]; if (!d) continue;
    if (d.space === 'local') Local.save(d); else Cloud.write(d);
  }
  if (doc) $('#title').placeholder = docTitle({ ...doc, title: '' });
  renderSidebar();
}
function saveViewSoon(){
  clearTimeout(viewTimer);
  viewTimer = setTimeout(() => { if (doc) ls.set(LS_VIEW + doc.id, JSON.stringify(view)); }, 400);
}
const strip = d => ({ id: d.id, title: d.title || '', nodes: d.nodes, roots: d.roots, items: d.items, updated: d.updated });

const Local = {
  saveStore(){ ls.set(LS_KEY, JSON.stringify(store)); },
  loadAll(){
    const out = [];
    for (const id of store.order){
      try {
        const d = JSON.parse(ls.get(LS_DOC + id) || 'null');
        if (d && d.nodes && Array.isArray(d.roots)){ normalize(d); d.space = 'local'; out.push(d); }
      } catch(e){}
    }
    return out;
  },
  save(d){
    if (!store.order.includes(d.id)) store.order.push(d.id);
    const ok = ls.set(LS_DOC + d.id, JSON.stringify(strip(d))) && ls.set(LS_KEY, JSON.stringify(store));
    if (!ok && !saveWarned){ saveWarned = true; toast('This browser is out of storage space, so the latest changes were not saved. Remove some images, or use Export.', 6000); }
  },
  remove(id){ ls.del(LS_DOC + id); ls.del(LS_VIEW + id); store.order = store.order.filter(x => x !== id); this.saveStore(); }
};

const Cloud = {
  privRef(id){ return db.collection('data/users/' + myId).doc('b_' + id); },
  sharedRef(id){ return db.doc('boards/' + id); },
  body(d){ return { title: d.title || '', content: JSON.stringify({ nodes: d.nodes, roots: d.roots, items: d.items }), updated: d.updated || Date.now(), rev: d._rev }; },
  async write(d){
    if (d._writing){ d._again = true; return; }
    d._writing = true;
    try {
      do {
        d._again = false;
        d._rev = rid();
        markMine(d, d._rev);
        const body = this.body(d);
        if (body.content.length > 240000){ toast('This board is too big to save. Remove some images, or split it into two boards.', 6000); break; }

    } catch(err){ this.fail(err, d); }

  },
  fail(err, d){

  },

/** Remember the versions this tab wrote, so their echoes (even late, out-of-order ones) are never mistaken for someone else's edit. */

    return;
  }
  d.space = space;
  if (space === 'shared'){ d.owner = data.owner; d.members = data.members || []; d.linkAccess = data.linkAccess || 'none'; }

}

/* =========================================================================

function makeNodeEl(id){

  el.className = 'node';
  el.dataset.id = id;
  el.innerHTML = '<div class="label" spellcheck="false"></div><button class="tog" tabindex="-1" title="Collapse (' + MOD + '/)"></button><button class="badge" tabindex="-1" title="Expand"></button><button class="plus" tabindex="-1" title="Add child (Tab)" aria-label="Add child"><svg viewBox="0 0 10 10"><path d="M5 1.5v7M1.5 5h7"/></svg></button><button class="sib" tabindex="-1" title="Add sibling below (Enter)" aria-label="Add sibling"><svg viewBox="0 0 10 10"><path d="M5 1.5v7M1.5 5h7"/></svg></button>';

}
function clearCanvas(){
  for (const el of els.values()) el.remove(); els.clear();

}

function render(){
  if (!doc){ clearCanvas(); updateHint(); return; }
  reindex();
  renderItems();
  const vis = [];
  for (const r of doc.roots){ const walk = id => { vis.push(id); for (const k of visibleKids(id)) walk(k); }; walk(r.id); }
  const visSet = new Set(vis);
  for (const id of [...sel]) if (!visSet.has(id) && !doc.items[id]) sel.delete(id);
  if (primary && !visSet.has(primary) && !doc.items[primary]) primary = [...sel].pop() || null;
  if (editing && !visSet.has(editing)) editing = null;

  for (const [id, el] of els) if (!visSet.has(id)){ el.remove(); els.delete(id); }
  for (const id of vis){
    let el = els.get(id);
    if (!el){ el = makeNodeEl(id); els.set(id, el); nodesLayer.appendChild(el); }
    const n = doc.nodes[id], root = isRoot(id);
    el.className = 'node' + (root ? ' root' : depthOf[id] === 1 ? ' l1' : '') +
      (sel.has(id) ? ' sel' : '') + (editing === id ? ' editing' : '') +
      (n.children.length ? ' has-kids' : '') + (n.collapsed && n.children.length ? ' collapsed' : '') +
      (dragSet && dragSet.has(id) ? ' dragging' : '') + (pos[id] && pos[id].dir < 0 ? ' left' : '');
    el.style.setProperty('--c', branchColor(id) || 'var(--muted)');
    el.style.setProperty('--add', root ? 'var(--sel)' : (branchColor(id) || 'var(--sel)'));
    const label = el.firstChild;
    label.dataset.ph = root ? 'Central idea' : '';
    if (editing !== id && label.textContent !== n.text) label.textContent = n.text;
    if (n.collapsed && n.children.length) el.querySelector('.badge').textContent = countDesc(id);
  }
  const size = {};

  pos = {};

  for (const id of vis){
    const p = pos[id], el = els.get(id);
    el.style.transform = `translate(${p.x}px,${p.y}px)`;
    el.classList.toggle('left', p.dir < 0);

}

function itemSig(it){

function renderItems(){

  list.forEach((it, i) => {
    let el = itemEls.get(it.id);

function layoutRoot(r, size){
  const memo = {};
  const vgap = id => isRoot(id) ? VGAP_ROOT : depthOf[id] === 1 ? VGAP_L1 : VGAP;
  const hgap = id => isRoot(id) ? HGAP_ROOT : HGAP;
  const sh = id => {
    if (memo[id] != null) return memo[id];
    const ks = visibleKids(id);
    let t = size[id].h;
    if (ks.length){ let s = vgap(id) * (ks.length - 1); for (const k of ks) s += sh(k); t = Math.max(t, s); }
    return (memo[id] = t);
  };
  const place = (id, ax, cy, dir) => {
    const s = size[id];
    pos[id] = { x: dir > 0 ? ax : ax - s.w, y: cy - s.h / 2, w: s.w, h: s.h, dir };
    placeKids(id, visibleKids(id), dir);
  };
  const placeKids = (id, ks, dir) => {
    if (!ks.length) return;
    const p = pos[id], g = vgap(id);
    let total = -g; for (const k of ks) total += sh(k) + g;
    let y = p.y + p.h / 2 - total / 2;
    const ax = dir > 0 ? p.x + p.w + hgap(id) : p.x - hgap(id);
    for (const k of ks){ const h = sh(k); place(k, ax, y + h / 2, dir); y += h + g; }
  };
  const s = size[r.id];
  pos[r.id] = { x: r.x - s.w / 2, y: r.y - s.h / 2, w: s.w, h: s.h, dir: 0 };
  const ks = visibleKids(r.id);
  if (r.layout === 'left') placeKids(r.id, ks, -1);
  else if (r.layout === 'both'){
    const tot = ks.reduce((a, k) => a + sh(k), 0);
    const right = [], left = []; let acc = 0;
    for (const k of ks){ if (!right.length || acc + sh(k) / 2 <= tot / 2){ right.push(k); acc += sh(k); } else left.push(k); }
    placeKids(r.id, right, 1); placeKids(r.id, left, -1);
  } else placeKids(r.id, ks, 1);
}

function drawEdges(vis){
  let out = '';
  for (const id of vis){
    const p = parentOf[id]; if (p == null) continue;
    const a = pos[p], b = pos[id], dir = b.dir;
    const sx = dir > 0 ? a.x + a.w : a.x, sy = a.y + a.h / 2;
    const ex = dir > 0 ? b.x : b.x + b.w, ey = b.y + b.h / 2;
    const L = (ex - sx) * 0.62;
    const d = `M${sx} ${sy}C${sx + L * .5} ${sy} ${sx + L * .5} ${ey} ${sx + L} ${ey}L${ex} ${ey}`;
    out += `<path d="${d}" stroke="${branchColor(id)}"${dragSet && dragSet.has(id) ? ' class="dim"' : ''}/>`;
  }

}
function updateSelBox(){
  if (!doc || sel.size < 2){ selboxEl.hidden = true; return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const id of sel){ const b = boxOf(id); if (!b) continue; x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); }
  if (!isFinite(x0)){ selboxEl.hidden = true; return; }
  selboxEl.hidden = false;
  Object.assign(selboxEl.style, { left: (x0 - 8) + 'px', top: (y0 - 8) + 'px', width: (x1 - x0 + 16) + 'px', height: (y1 - y0 + 16) + 'px' });
}
function updateHint(){
  const h = $('#hint');
  if (!doc){
    h.hidden = !$('#loading').hidden;
    h.innerHTML = `<h2>No boards yet</h2>${MODE === 'cloud' ? 'Boards are saved to your account and stay private to you until you share them.' : 'Boards are saved in this browser.'}<div class="row"><button class="btn primary" data-h="new">New board</button><button class="btn" data-h="example">Add the example boards</button></div>`;
    return;
  }
  const empty = !doc.roots.length && !Object.keys(doc.items).length;
  h.hidden = !empty;
  if (empty) h.innerHTML = `Double-click the canvas or press <kbd>M</kbd> to start a mind map.<br>Paste a table or an image to add it.`;

/* =========================================================================
   View (pan / zoom)
   ========================================================================= */
function applyView(){
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`;
  const g = 24 * view.z;
  stage.style.backgroundSize = `${g}px ${g}px`;
  stage.style.backgroundPosition = `${view.x}px ${view.y}px`;
  $('#zoomPct').textContent = Math.round(view.z * 100) + '%';
  positionToolbar();
  saveViewSoon();
}
let anim = 0;
function animateView(t, ms = 220){
  cancelAnimationFrame(anim);

  const step = now => {
    const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    view.x = s.x + (t.x - s.x) * e; view.y = s.y + (t.y - s.y) * e; view.z = s.z + (t.z - s.z) * e;
    applyView();
    if (k < 1) anim = requestAnimationFrame(step);
  };

}
const stageRect = () => stage.getBoundingClientRect();
function toWorld(cx, cy){ const r = stageRect(); return { x: (cx - r.left - view.x) / view.z, y: (cy - r.top - view.y) / view.z }; }
function centerWorld(){ const r = stageRect(); return toWorld(r.left + r.width / 2, r.top + r.height / 2); }
let lastPaste = null;
function pastePoint(){
  const r = stageRect();
  let p = (lastPointer && Date.now() - lastPointer.t < 60000 && lastPointer.x > r.left && lastPointer.x < r.right && lastPointer.y > r.top && lastPointer.y < r.bottom)
    ? toWorld(lastPointer.x, lastPointer.y) : centerWorld();
  // pasting again at the same spot steps each copy down-right so they don't stack exactly
  if (lastPaste && Math.abs(lastPaste.bx - p.x) < 2 && Math.abs(lastPaste.by - p.y) < 2) lastPaste.n++;

  return { x: p.x + lastPaste.n * 32, y: p.y + lastPaste.n * 32 };
}
function zoomTarget(z, sx, sy){
  z = clamp(z, 0.1, 3);
  const wx = (sx - view.x) / view.z, wy = (sy - view.y) / view.z;
  return { z, x: sx - wx * z, y: sy - wy * z };
}
function zoomBy(f){ const r = stageRect(); animateView(zoomTarget(view.z * f, r.width / 2, r.height / 2), 160); }
function zoomTo(z){ const r = stageRect(); animateView(zoomTarget(z, r.width / 2, r.height / 2)); }
function allIds(){ return doc ? [...Object.keys(pos), ...Object.keys(doc.items)] : []; }
function fit(ids, maxZ = 1.2, instant = false){
  ids = (ids || allIds()).filter(id => boxOf(id));
  if (!ids.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const id of ids){ const p = boxOf(id); x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x + p.w); y1 = Math.max(y1, p.y + p.h); }
  const r = stageRect(), pad = r.width < 600 ? 24 : 80, left = r.width < 600 ? 0 : 50;
  const z = clamp(Math.min((r.width - pad * 2 - left) / (x1 - x0 || 1), (r.height - pad * 2 - 50) / (y1 - y0 || 1)), 0.1, maxZ);
  const t = { z, x: (r.width + left) / 2 - ((x0 + x1) / 2) * z, y: (r.height + 30) / 2 - ((y0 + y1) / 2) * z };
  if (instant){ Object.assign(view, t); applyView(); } else animateView(t);
}
function zoomKey(k){
  if (k === '0') zoomTo(1);
  else if (k === '1') fit();

}
function ensureVisible(id){
  const p = boxOf(id); if (!p) return;
  const r = stageRect(), m = 48, top = 70, left = r.width < 600 ? m : 70;
  const sx = view.x + p.x * view.z, sy = view.y + p.y * view.z, sw = p.w * view.z, shh = p.h * view.z;
  let dx = 0, dy = 0;
  if (sx < left) dx = left - sx; else if (sx + sw > r.width - m) dx = Math.max((r.width - m) - (sx + sw), left - sx);
  if (sy < top) dy = top - sy; else if (sy + shh > r.height - m) dy = (r.height - m) - (sy + shh);
  if (dx || dy) animateView({ x: view.x + dx, y: view.y + dy, z: view.z }, 180);
}

/* =========================================================================
   Selection & editing
   ========================================================================= */
function select(id, add = false){
  if (!add) sel.clear();
  if (id != null && (isNode(id) || isItem(id))){ sel.add(id); primary = id; } else if (!add) primary = null;
  refreshSel();
}
function refreshSel(){
  for (const [id, el] of els) el.classList.toggle('sel', sel.has(id));
  for (const [id, el] of itemEls) el.classList.toggle('sel', sel.has(id));
  if (tableCursor && !sel.has(tableCursor.id)) tableCursor = null;
  updateSelBox(); updateToolbar();
}
function selectAll(){ sel = new Set(allIds()); primary = primary || [...sel][0] || null; refreshSel(); }

const readText = el => el.innerText.replace(/ /g, ' ');
function makeEditable(t){
  try { t.contentEditable = 'plaintext-only'; } catch(e){}
  if (t.contentEditable !== 'plaintext-only') t.contentEditable = 'true';
}
function placeCaret(el, all){
  const range = document.createRange();
  range.selectNodeContents(el);
  if (!all) range.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(range);
}
function blurEditor(){ const a = document.activeElement; if (a && a.closest && (a.closest('.node') || a.closest('.item'))) a.blur(); }

function startEdit(id, opts = {}){
  if (editing === id) return;
  commitEdit(); commitItemEdit();
  if (!doc.nodes[id]) return;
  select(id);
  const el = els.get(id); if (!el) return;
  editing = id;
  editBefore = opts.before ?? snapshot();
  el.classList.add('editing');
  const lab = el.firstChild;
  makeEditable(lab);
  if (opts.text != null){ lab.textContent = opts.text; doc.nodes[id].text = opts.text; }
  lab.focus({ preventScroll: true });
  placeCaret(lab, opts.selectAll);
  render();
}
function commitEdit(){
  if (!editing) return;
  const id = editing; editing = null;
  const n = doc.nodes[id], el = els.get(id);
  if (n){
    const lab = el && el.firstChild;
    let t = lab ? readText(lab) : n.text;
    t = t.replace(/^\s+|\s+$/g, '').replace(/\n{3,}/g, '\n\n');
    n.text = t;
    if (lab){ lab.removeAttribute('contenteditable'); lab.textContent = t; }
    reindex();
    const lonelyRoot = isRoot(id) && doc.roots.length === 1 && !Object.keys(doc.items).length;
    if (!t && !n.children.length && !lonelyRoot){
      const fb = removeNodes([id]);
      sel.delete(id);
      if (primary === id){ primary = fb; if (fb) sel.add(fb); }
    }
  }
  blurEditor();
  const changed = editBefore != null && snapshot() !== editBefore;
  if (changed) record(editBefore);
  editBefore = null;
  if (changed) touch();

}
function createAndEdit(fn){
  commitEdit(); commitItemEdit();
  const before = snapshot();
  const id = fn();
  reindex(); select(id); render();
  startEdit(id, { before });
  ensureVisible(id);
}

/* ---------- editing notes, text and table cells ---------- */
function startItemEdit(id, opts = {}){
  commitEdit(); commitItemEdit();
  const it = doc.items[id]; if (!it || it.type === 'image') return;
  select(id);
  render();
  const el = itemEls.get(id);
  let target, r = null, c = null;
  if (it.type === 'table'){
    r = clamp(opts.r ?? (tableCursor && tableCursor.id === id ? tableCursor.r : 0), 0, it.rows.length - 1);
    c = clamp(opts.c ?? (tableCursor && tableCursor.id === id ? tableCursor.c : 0), 0, it.rows[0].length - 1);
    target = el.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
    tableCursor = { id, r, c };
  } else target = el.querySelector('.ibody');
  if (!target) return;
  iedit = { id, r, c, el: target, before: opts.before ?? snapshot() };
  el.classList.add('editing');
  for (const td of el.querySelectorAll('td.cur')) td.classList.remove('cur');
  makeEditable(target);
  if (opts.text != null) target.textContent = opts.text;
  target.focus({ preventScroll: true });
  placeCaret(target, opts.selectAll);
  updateToolbar();
}
function commitItemEdit(){

/* =========================================================================
   Commands
   ========================================================================= */
function addChild(id){

}

}
function addParent(id){

function addRoot(x, y){ createAndEdit(() => { const c = newNode(); doc.roots.push({ id: c, x, y, layout: 'right' }); return c; }); }

function foldAll(id){

function setColor(c){ change(() => { for (const id of sel) if (isNode(id) && !isRoot(id)) doc.nodes[id].color = c || null; }); }
function setLayout(v){ const r = rootEntry(primary); if (!r) return; change(() => { r.layout = v; }); }

}
function reorder(id, delta){

function indent(id){

function outdent(id){

function nudge(dx, dy){

/* ---------- tables ---------- */
function addTable(rows, at){
  const fresh = [];
  change(() => { fresh.push(addItem({ type: 'table', x: Math.round(at.x), y: Math.round(at.y), rows, header: true })); });
  const id = fresh[0], b = itemBox(id), it = doc.items[id];
  it.x = Math.round(at.x - b.w / 2); it.y = Math.round(at.y - b.h / 2);
  select(id); tableCursor = { id, r: 0, c: 0 }; render(); ensureVisible(id);
  toast(`Added a table with ${rows.length} row${rows.length === 1 ? '' : 's'}`);
}
function tableOp(op){
  const id = primary, it = doc.items[id]; if (!it || it.type !== 'table') return;
  const cur = tableCursor && tableCursor.id === id ? tableCursor : { r: it.rows.length - 1, c: it.rows[0].length - 1 };
  change(() => {
    const cols = it.rows[0].length;
    if (op === 'row+') it.rows.splice(cur.r + 1, 0, Array(cols).fill(''));
    if (op === 'col+') it.rows.forEach(r => r.splice(cur.c + 1, 0, ''));
    if (op === 'row-' && it.rows.length > 1) it.rows.splice(cur.r, 1);
    if (op === 'col-' && cols > 1) it.rows.forEach(r => r.splice(cur.c, 1));

  });

  if (op === 'col+') nc++;

/* ---------- images ---------- */
async function loadBitmap(file){
  try { return await createImageBitmap(file); }
  catch(e){
    return await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
  }
}
function encodeImage(bmp, maxDim, budget){
  const W = bmp.width, H = bmp.height;
  for (let dim = maxDim; dim >= 240; dim = Math.round(dim * 0.75)){
    const s = Math.min(1, dim / Math.max(W, H));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(W * s)); c.height = Math.max(1, Math.round(H * s));
    const g = c.getContext('2d');
    g.drawImage(bmp, 0, 0, c.width, c.height);
    for (const q of [0.86, 0.72, 0.58]){
      let url = c.toDataURL('image/webp', q);
      if (!url.startsWith('data:image/webp')){
        g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        url = c.toDataURL('image/jpeg', q);
      }
      if (url.length <= budget) return url;
    }
  }
  return null;
}
async function addImageFile(file, at){
  if (!doc) return;
  if (!/^image\//.test(file.type)){ toast('Only image files can be added to the canvas'); return; }
  const target = doc;
  toast('Adding image…', 15000);
  let bmp;
  try { bmp = await loadBitmap(file); } catch(e){ toast('That image could not be opened. Try a PNG or JPEG.'); return; }
  const scale = Math.min(1, 520 / Math.max(bmp.width, bmp.height));
  const w = Math.max(40, Math.round(bmp.width * scale)), h = Math.max(40, Math.round(bmp.height * scale));
  let src = null;
  if (MODE === 'cloud' && assetsApi){
    try {
      let blob = file;
      if (!/^image\/(png|jpeg|gif|webp)$/.test(file.type) || file.size > 20e6){
        const url = encodeImage(bmp, 2400, 15e6); if (!url) throw new Error('encode');
        blob = await (await fetch(url)).blob();
      }
      const res = await assetsApi.upload(blob);
      src = { asset: res.id };
    } catch(e){ src = null; }
  }
  if (!src){
    const url = encodeImage(bmp, MODE === 'cloud' ? 1100 : 1600, MODE === 'cloud' ? 140000 : 600000);
    if (!url){ toast('That image is too large to store. Try a smaller one.'); return; }
    src = { data: url };
  }
  if (doc !== target) return;
  const fresh = [];
  change(() => { fresh.push(addItem({ type: 'image', x: Math.round(at.x - w / 2), y: Math.round(at.y - h / 2), w, h, src })); });
  select(fresh[0]); ensureVisible(fresh[0]);
  toast('Image added');
}
function addImageFiles(files, at){ [...files].forEach((f, i) => addImageFile(f, { x: at.x + i * 30, y: at.y + i * 30 })); }

/* ---------- arrow-key navigation ---------- */
function nav(key){
  if (!isNode(primary) || !pos[primary]){ const f = doc.roots[0]; if (f){ select(f.id); ensureVisible(f.id); } return; }
  const id = primary, p = pos[id];
  const nearestChild = side => {
    const ks = visibleKids(id).filter(k => pos[k] && (side == null || pos[k].dir === side));
    let best = null, bd = Infinity; const cy = p.y + p.h / 2;
    for (const k of ks){ const d = Math.abs(pos[k].y + pos[k].h / 2 - cy); if (d < bd){ bd = d; best = k; } }
    return best;
  };
  let t = null;
  if (key === 'ArrowRight') t = p.dir > 0 ? nearestChild(1) : p.dir < 0 ? parentOf[id] : nearestChild(1);
  else if (key === 'ArrowLeft') t = p.dir < 0 ? nearestChild(-1) : p.dir > 0 ? parentOf[id] : nearestChild(-1);
  else t = vertical(id, key === 'ArrowUp' ? -1 : 1);
  if (t != null){ select(t); ensureVisible(t); }
}
function vertical(id, s){
  const p = pos[id], cy = p.y + p.h / 2;
  let best = null, bd = Infinity;
  for (const k in pos){
    if (k === id) continue;
    const q = pos[k];
    if (rootOf[k] !== rootOf[id] || depthOf[k] !== depthOf[id] || q.dir !== p.dir) continue;
    const dy = (q.y + q.h / 2 - cy) * s;
    if (dy > 0 && dy < bd){ bd = dy; best = k; }
  }
  if (best) return best;
  const cx = p.x + p.w / 2;
  for (const k in pos){
    if (k === id) continue;
    const q = pos[k], dy = (q.y + q.h / 2 - cy) * s;
    if (dy <= 0) continue;
    const score = dy + Math.abs(q.x + q.w / 2 - cx) * 2;
    if (score < bd){ bd = score; best = k; }
  }
  return best;
}

/* =========================================================================
   Keyboard
   ========================================================================= */
const isField = t => t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || (t.isContentEditable && !(t.closest && (t.closest('.node') || t.closest('.item')))));
document.addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (!$('#dialog').hidden){ if (e.key === 'Escape') closeDialog(); return; }
  if (!$('#menu').hidden && e.key === 'Escape'){ closeMenu(); return; }
  if (editing){ onEditKey(e); return; }
  if (iedit){ onItemEditKey(e); return; }
  if (isField(e.target)){ if (e.key === 'Escape' || (e.key === 'Enter' && e.target.id === 'title')) e.target.blur(); return; }
  const mod = e.metaKey || e.ctrlKey, k = e.key;
  if (mod && !e.altKey && k.toLowerCase() === 'e'){ e.preventDefault(); toggleSidebar(); return; }
  if (!doc) return;

  if (mod && !e.altKey){
    const kl = k.toLowerCase();
    if (kl === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (kl === 'y'){ e.preventDefault(); redo(); return; }
    if (k === '/' || k === '?'){ e.preventDefault(); if (isNode(primary)) (e.shiftKey ? foldAll : toggleCollapse)(primary); return; }
    if (k === 'Enter'){ e.preventDefault(); if (isNode(primary)) addSibling(primary, true); return; }
    if (kl === 'd'){ e.preventDefault(); duplicate(); return; }
    if (kl === 'a'){ e.preventDefault(); selectAll(); return; }
    if (k === '=' || k === '+'){ e.preventDefault(); zoomBy(1.25); return; }
    if (k === '-' || k === '_'){ e.preventDefault(); zoomBy(1 / 1.25); return; }
    if (k === '0'){ e.preventDefault(); zoomTo(1); return; }
    return; // ⌘C / ⌘X / ⌘V are handled by the clipboard events
  }
  if (k === 'Escape'){
    if (!$('#help').hidden) toggleHelp(false);

    else select(null);
    return;
  }
  if (k === ' ' && !e.altKey){ e.preventDefault(); if (!spaceDown){ spaceDown = true; stage.classList.add('space'); } return; }
  if (e.shiftKey && !e.altKey && /^Digit[012]$/.test(e.code)){ e.preventDefault(); zoomKey(e.code.slice(-1)); return; }

  if (!primary){
    const tk = { v: 'select', h: 'hand', n: 'note', t: 'text', e: 'table', i: 'image' }[k.toLowerCase()];
    if (tk && !e.altKey && !e.shiftKey){ e.preventDefault(); setTool(tk); return; }
    if (k === 'm' || k === 'M'){ e.preventDefault(); addRootAtCenter(); return; }
    if (k === '=' || k === '+'){ zoomBy(1.25); return; }
    if (k === '-'){ zoomBy(1 / 1.25); return; }
    if (k === '0' || k === '1' || k === '2'){ zoomKey(k); return; }
    if (k === '?'){ toggleHelp(); return; }

    return;
  }
  if (isItem(primary)){ onItemKey(e); return; }
  if (k === 'Tab'){
    e.preventDefault();
    if (e.shiftKey){ const p = parentOf[primary]; if (p != null){ select(p); ensureVisible(p); } }

    return;
  }
  if (k === 'Enter'){
    e.preventDefault();

    return;
  }
  if (k === 'F2'){ e.preventDefault(); startEdit(primary); return; }
  if (k === 'Delete' || k === 'Backspace'){ e.preventDefault(); deleteSelection(); return; }
  if (k.startsWith('Arrow')){
    e.preventDefault();

      else if (k === 'ArrowDown') reorder(id, 1);
      else {

        change(() => { deeper ? indent(id) : outdent(id); });
        select(id); ensureVisible(id);
      }

  }
  if (k.length === 1 && !e.altKey){ e.preventDefault(); startEdit(primary, { text: k }); return; }
});
function onItemKey(e){
  const it = doc.items[primary], k = e.key;

  if (k.startsWith('Arrow')){
    e.preventDefault();

      const r = tableCursor.r + (k === 'ArrowDown') - (k === 'ArrowUp'), c = tableCursor.c + (k === 'ArrowRight') - (k === 'ArrowLeft');
      tableCursor = { id: it.id, r: clamp(r, 0, it.rows.length - 1), c: clamp(c, 0, it.rows[0].length - 1) };
      render(); return;
    }
    const s = e.shiftKey ? 10 : 1;
    nudge(k === 'ArrowLeft' ? -s : k === 'ArrowRight' ? s : 0, k === 'ArrowUp' ? -s : k === 'ArrowDown' ? s : 0);
    return;
  }
  if (k === 'Enter' || k === 'F2'){ e.preventDefault(); startItemEdit(it.id); return; }
  if (k.length === 1 && !e.altKey && it.type !== 'image'){ e.preventDefault(); startItemEdit(it.id, { text: it.type === 'note' ? (it.text || '') + k : k }); }
}
document.addEventListener('keyup', e => { if (e.key === ' '){ spaceDown = false; stage.classList.remove('space'); } });
window.addEventListener('blur', () => { spaceDown = false; stage.classList.remove('space'); });

function onEditKey(e){
  const mod = e.metaKey || e.ctrlKey, k = e.key, id = editing;
  const lab = els.get(id).firstChild;
  if (k === 'Enter'){
    if (e.shiftKey && !mod && !e.altKey){
      if (lab.contentEditable !== 'plaintext-only'){ e.preventDefault(); document.execCommand('insertLineBreak'); }
      return;
    }
    e.preventDefault();
    const empty = !readText(lab).trim();
    commitEdit();
    if (!doc.nodes[id]) return;
    if (e.altKey) addParent(id);
    else if (mod) addSibling(id, true);
    else if (!empty) addSibling(id, false);
    return;
  }
  if (k === 'Tab'){
    e.preventDefault();
    const empty = !readText(lab).trim();
    if (empty && !isRoot(id)){
      if (e.shiftKey ? outdent(id) : indent(id)){ render(); lab.focus({ preventScroll: true }); ensureVisible(id); }
      return;
    }
    commitEdit();
    if (!doc.nodes[id]) return;
    if (e.shiftKey){ const p = parentOf[id]; if (p != null) select(p); }
    else addChild(id);
    return;
  }
  if (k === 'Escape'){ e.preventDefault(); commitEdit(); return; }
  if (mod && (k === '/' || k === '?')){ e.preventDefault(); commitEdit(); if (doc.nodes[id]) toggleCollapse(id); return; }

}
function onItemEditKey(e){
  const k = e.key, it = doc.items[iedit.id];
  if (k === 'Escape'){ e.preventDefault(); commitItemEdit(); return; }
  if ((e.metaKey || e.ctrlKey) && !e.altKey && /^[biu]$/i.test(k)){ e.preventDefault(); return; }
  if (!it) return;

    e.preventDefault();

    else nr++;

    if (nr < 0) return;
    if (nr >= it.rows.length){
      if (k === 'Enter'){ tableCursor = { id, r, c }; render(); return; }
      change(() => { it.rows.push(Array(cols).fill('')); });
    }
    startItemEdit(id, { r: nr, c: nc });
    return;
  }
  if (it.type === 'text' && k === 'Enter' && !e.shiftKey){ e.preventDefault(); commitItemEdit(); }
}

nodesLayer.addEventListener('input', e => {

itemsLayer.addEventListener('input', () => { if (iedit){ const el = itemEls.get(iedit.id); if (el) itemRect[iedit.id] = { w: el.offsetWidth, h: el.offsetHeight }; } });
for (const layerEl of [nodesLayer, itemsLayer]){
  layerEl.addEventListener('paste', e => {

/** Where would the dragged node land? */

    let by;
    if (i === 0) by = pos[ks[0]].y - 4;
    else if (i === ks.length) by = pos[ks[i - 1]].y + pos[ks[i - 1]].h + 4;

function toggleTheme(){

async function copyText(text, okMsg){
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch(err){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(e2){}
    ta.remove(); toast(ok ? okMsg : 'Copy was blocked by the browser');
  }
}
$('#copyText').addEventListener('click', () => { if (doc) copyText(outlineOf(doc.roots.map(r => r.id)), 'Whole map copied as an indented list'); });
$('#exportJson').addEventListener('click', async () => {
  if (!doc) return;
  const json = JSON.stringify({ format: 'mindmap', version: 2, ...strip(doc) }, null, 2);
  const name = docTitle(doc).replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'board';
  let framed = false; try { framed = window.top !== window.self; } catch(e){ framed = true; }
  if (framed){
    const dl = window.claude ? await window.claude.use('downloads').catch(() => null) : null;
    if (dl){ try { await dl.save({ filename: name + '.json', data: json }); return; } catch(e){ /* declined or unavailable: copy instead */ } }
    copyText(json, 'Board data copied. Paste it into a .json file to keep a backup.');
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = name + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importFile(f); });
async function importFile(f){
  const text = await f.text();
  let d = null;
  try {
    const j = JSON.parse(text);
    if (j && j.nodes && Array.isArray(j.roots)){
      d = makeDoc(j.title || '', null);
      Object.assign(d, normalize({ nodes: j.nodes, roots: j.roots, items: j.items }));
    }
  } catch(err){}
  if (!d){
    const name = f.name.replace(/\.[^.]+$/, '');
    const trees = parseOutline(text);
    if (!trees.length){ toast('That file has no list or board in it'); return; }
    d = makeDoc(trees.length === 1 ? '' : name, text);
  }
  flushSaves(); openDoc(d.id);
  toast('Imported ' + docTitle(d));
}

  const t = $('#toast'); t.textContent = msg; t.classList.add('show');

}

function startLocal(){
  MODE = 'local';
  for (const d of Local.loadAll()) docs[d.id] = d;
  store.order = store.order.filter(id => docs[id]);
  if (!store.order.length && !store.seeded){
    store.seeded = true;
    const a = makeDoc('', SAMPLE_2); a.updated = Date.now();
    const b = makeDoc('', SAMPLE_1); b.updated = Date.now() - 60000;
    flushSaves();
    store.current = a.id;
  }
  Local.saveStore();
  $('#profileName').textContent = 'This browser';
  if (me && me.avatarUrl) $('#avatar').src = me.avatarUrl; else $('#avatar').hidden = true;
  docs[store.current] ? openDoc(store.current) : openFallback();
  openFromHash();
}
function startCloud(){
  MODE = 'cloud';
  localBoards = Local.loadAll();
  $('#profileName').textContent = me.name || 'My boards';
  $('#avatar').src = me.avatarUrl;
  $('#loading').hidden = false;
  Cloud.subscribe(() => {
    $('#loading').hidden = true;
    docs[store.cloudCurrent] ? openDoc(store.cloudCurrent) : openFallback();
    renderSidebar();
    openFromHash();
  });
}
async function boot(){
  try { const s = JSON.parse(ls.get(LS_KEY) || 'null'); if (s && Array.isArray(s.order)) Object.assign(store, s); } catch(e){}
  store.closed = store.closed || {};
  document.documentElement.dataset.theme = store.theme || 'dark';
  sidebarOpen = store.sidebar !== false && !isNarrow();
  app.classList.toggle('nosidebar', !sidebarOpen);
  $('#toggleSidebar').classList.toggle('on', sidebarOpen);
  buildHelp();
  updateUndoButtons();
  const api = window.claude && typeof window.claude.use === 'function' ? window.claude : null;
  if (api){
    $('#loading').hidden = false;
    const safe = p => Promise.resolve(p).catch(() => null);
    [db, userApi, assetsApi] = await Promise.all([safe(api.use('db')), safe(api.use('user')), safe(api.use('assets'))]);
    if (userApi){ try { me = await userApi.me(); myId = me.id; } catch(e){} }
    let canWrite = null;
    if (userApi){ try { canWrite = await userApi.can('data.write'); } catch(e){} }
    $('#loading').hidden = true;
    if (db && myId && canWrite !== false) return startCloud();
    if (db && myId && canWrite === false) banner('You have view-only access to this app, so boards are saved in this browser only.');
  }
  startLocal();
}
